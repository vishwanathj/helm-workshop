apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.fullname" . }}-html
  labels:
    {{- include "common.labels" . | nindent 4 }}
data:
  index.html: |
    <html>
      <body>
        <h1>{{ .Values.html.message | default "Hello from the Helm workshop!" }}</h1>
      </body>
    </html>
