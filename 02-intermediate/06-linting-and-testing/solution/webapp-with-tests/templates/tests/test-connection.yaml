apiVersion: v1
kind: Pod
metadata:
  name: {{ include "webapp.fullname" . }}-test-connection
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ["wget"]
      args: ["-q", "-O-", "http://{{ include "webapp.fullname" . }}:{{ .Values.service.port }}"]
  restartPolicy: Never
